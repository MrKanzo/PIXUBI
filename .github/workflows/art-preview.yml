name: PIXUBI art preview (debug only)
on:
  push:
    branches: [art-preview-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check imported artwork
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, struct
          root=pathlib.Path('app/src/main/assets')
          data=json.loads((root/'imported_v2/catalog.json').read_text())
          forms=data['forms']
          assert len(forms)==len({f['prefix'] for f in forms})==40
          assert sum(len(f['frames']) for f in forms)==180
          for f in forms:
              b=(root/f['atlas']).read_bytes()
              assert hashlib.sha256(b).hexdigest()==f['sha256']
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',b[16:24])
              assert [w,h]==f['size']
              assert 'neutral' in f['frames']
              for x,y,cw,ch in f['frames'].values():
                  assert cw==ch==128 and 0<=x<=w-cw and 0<=y<=h-ch
          fx=(root/'imported_v2/ultra_effects.png').read_bytes()
          assert struct.unpack('>II',fx[16:24])==(768,1280)
          assert hashlib.sha1(('blob '+str(len(fx))+'\0').encode()+fx).hexdigest()=='0e4500dd6cb92428454edfbb9475a34660697bbe'
          print('Verified 40 original PNG atlases, 180 frame references, and 60 effect cells')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-art-preview-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-eye-review
          path: app/build/imported-preview/blink-40.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-expression-review
          path: app/build/imported-preview/expressions-40.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-appendage-review
          path: app/build/imported-preview/appendage-40.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-paw-review
          path: app/build/imported-preview/paws-40.png
          if-no-files-found: error

      - name: Audit animation coverage
        run: python3 scripts/audit_imported_animation.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-animation-coverage
          path: app/build/imported-preview/animation-coverage.csv
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-sleep-breathing-review
          path: app/build/imported-preview/sleep-breathing.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-jump-review
          path: app/build/imported-preview/jump-30.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-run-review
          path: app/build/imported-preview/run-40.png
          if-no-files-found: error

      - name: Verify debug APK identity and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.pixubi.game.stable.mystery'"
          sha256sum "$APK" > app/build/imported-preview/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PIXUBI-device-QA
          path: |
            app/build/imported-preview/device-checklist.csv
            app/build/imported-preview/apk-sha256.txt
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
