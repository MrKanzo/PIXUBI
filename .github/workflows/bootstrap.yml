name: Prepare PIXUBI and build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore PIXUBI sources
        shell: bash
        run: |
          cat bootstrap/p1.b64 bootstrap/p2.b64 bootstrap/p3.b64 bootstrap/p4.b64 | base64 -d > /tmp/pixubi-source.tar.xz
          echo 'e427ee1fceb2bd85128eeb47889510715475155ccd5fcfd4f7c63bc5b3017735  /tmp/pixubi-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/pixubi-source.tar.xz
          sed -i -e 's/2026.09.00/2025.12.00/' -e 's/activity-compose:1.13.0/activity-compose:1.12.0/' -e 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.10.0/' app/build.gradle.kts
          mkdir -p .github/workflows
          cat > README.md <<'EOF'
          # PIXUBI 🐣
          Офлайн Android-гра про цифрових вихованців з п'ятьма різновидами.
          **Kotlin + Jetpack Compose**, без реклами й дозволу INTERNET.
          
          ## Як завантажити тестову гру
          GitHub Actions → Prepare PIXUBI and build APK → останній успішний запуск → Artifacts → pixubi-debug-apk.
          Розпакуй ZIP та встанови `app-debug.apk` на Android.
          
          ## Статус
          MVP 0.1: вибір виду, статі, регіону, випадковий колір, годування, вода, сон, сплячка, одна мінігра. Вільний рух і розмноження ще попереду.
          EOF
          rm -rf bootstrap
      - name: Commit unpacked source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add PIXUBI Android MVP source and APK workflow'
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pixubi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
